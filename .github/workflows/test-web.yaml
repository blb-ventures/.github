---
name: Test Web

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      check-paths:
        type: string
        default: frontend
      working-directory:
        type: string
        default: frontend
      node-version:
        type: number
        default: 20
      core-lint:
        type: boolean
        default: true
      run-tests:
        description: Run `<package-manager> test` after lint.
        type: boolean
        default: false
      test-command:
        description: >-
          Override the test script invocation. If empty, defaults to
          `<package-manager> test` when run-tests is true.
        type: string
        default: ''
      coverage-path:
        description: >-
          Comma- or newline-separated paths (relative to working-directory) to
          upload as a coverage artifact after tests run. Leave empty to skip.
        type: string
        default: ''
      package-manager:
        type: string
        default: yarn
      pnpm-version:
        type: string
        default: 10.29.2

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: marceloprado/has-changed-path@v1.0.1
        id: check
        with:
          paths: ${{ inputs.check-paths }}
  test:
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.has-changes == 'true' }}
    name: Test Web
    defaults:
      run:
        shell: bash
        working-directory: ./${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - id: setup-node
        name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          # yamllint disable-line rule:line-length
          cache-dependency-path: ${{ inputs.package-manager == 'yarn' && '**/yarn.lock' || '**/pnpm-lock.yaml' }}

      - name: Install dependencies
        # yamllint disable-line rule:line-length
        run: ${{ inputs.package-manager == 'yarn' && 'yarn install --immutable' || 'pnpm install --frozen-lockfile' }}

      - name: Core lint
        if: ${{ inputs.core-lint }}
        run: ${{ inputs.package-manager }} core-lint

      - name: Web lint
        run: ${{ inputs.package-manager }} web-lint

      - name: Run tests
        if: ${{ inputs.run-tests }}
        # yamllint disable-line rule:line-length
        run: ${{ inputs.test-command != '' && inputs.test-command || format('{0} test', inputs.package-manager) }}

      - name: Upload coverage
        if: ${{ inputs.run-tests && inputs.coverage-path != '' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: ${{ inputs.coverage-path }}
          retention-days: 14
          if-no-files-found: ignore
